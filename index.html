<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arrange the Sentence - Future Transportation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Comic Sans MS', sans-serif;
}

body{
    background:linear-gradient(135deg,#e8f7ff,#fff4e6);
    min-height:100vh;
    padding:24px;
}

.container{
    max-width:1400px;
    margin:auto;
}

h1{
    text-align:center;
    color:#4d6cfa;
    margin-bottom:18px;
    font-size:46px;
}

.top-bar{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:18px;
}

.question-box,
.timer-box{
    background:white;
    padding:16px 28px;
    border-radius:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.12);
    font-size:28px;
    font-weight:bold;
    color:#333;
}

.timer-box{
    color:#ff6b6b;
    min-width:170px;
    text-align:center;
}

.timer-box.warning{
    background:#fff3bf;
    color:#f08c00;
}

.timer-box.time-up{
    background:#ffe3e3;
    color:#c92a2a;
}

.instruction{
    text-align:center;
    font-size:26px;
    font-weight:bold;
    color:#2c7fb8;
    margin-bottom:16px;
}

.word-bank{
    position:relative;
    height:310px;
    background:#dff7ff;
    border:5px dashed #89d8f5;
    border-radius:30px;
    overflow:hidden;
    margin-bottom:24px;
}

.word-bank-title{
    position:absolute;
    top:10px;
    left:18px;
    font-size:26px;
    font-weight:bold;
    color:#2c7fb8;
    z-index:100;
}

.word{
    position:absolute;
    padding:14px 24px;
    border-radius:22px;
    background:#fff;
    border:3px solid #ffc9de;
    cursor:grab;
    user-select:none;
    box-shadow:0 4px 8px rgba(0,0,0,0.18);
    font-size:26px;
    font-weight:bold;
    white-space:nowrap;
    touch-action:none;
}

.word.dragging{
    opacity:0.7;
    z-index:999;
}

.answer-zone{
    min-height:190px;
    background:#fff;
    border:5px dashed #ffb6c1;
    border-radius:30px;
    padding:24px;
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    gap:14px;
    margin-bottom:24px;
}

.answer-zone::before{
    content:"Build the sentence here...";
    color:#aaa;
    width:100%;
    font-size:28px;
    font-weight:bold;
}

.answer-zone.has-word::before{
    display:none;
}

.controls{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:18px;
    margin-bottom:20px;
}

button{
    padding:16px 30px;
    border:none;
    border-radius:25px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
}

button:hover{
    transform:translateY(-2px);
}

.timer-button{
    background:#ff922b;
    color:white;
}

.show{
    background:#8ce99a;
}

.reset{
    background:#ffd43b;
}

.next{
    background:#74c0fc;
}

.answer-key{
    display:none;
    background:white;
    border:5px solid #8ce99a;
    border-radius:28px;
    padding:22px 28px;
    text-align:center;
    font-size:34px;
    font-weight:bold;
    color:#1b7f36;
    box-shadow:0 5px 14px rgba(0,0,0,0.15);
}

.answer-key.show-answer{
    display:block;
}

.time-message{
    display:none;
    margin-bottom:18px;
    text-align:center;
    font-size:36px;
    font-weight:bold;
    color:#c92a2a;
}

.time-message.show-time-message{
    display:block;
}

@media(max-width:768px){
    body{
        padding:12px;
    }

    h1{
        font-size:30px;
    }

    .question-box,
    .timer-box,
    .instruction{
        font-size:20px;
    }

    .word-bank{
        height:240px;
    }

    .answer-zone{
        min-height:150px;
    }

    .word{
        font-size:16px;
        padding:9px 15px;
    }

    button{
        font-size:16px;
        padding:11px 18px;
    }

    .answer-key{
        font-size:22px;
    }

    .time-message{
        font-size:26px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 Arrange the Sentence 🚀</h1>

<div class="top-bar">
    <div class="question-box">
        Question <span id="questionNum">1</span>/6
    </div>

    <div class="timer-box" id="timerBox">
        ⏱ <span id="timer">01:00</span>
    </div>
</div>

<div class="instruction">
    Drag the words to make a correct sentence.
</div>

<div class="word-bank" id="wordBank">
    <div class="word-bank-title">Word Bank</div>
</div>

<div class="answer-zone" id="answerZone"></div>

<div class="time-message" id="timeMessage">
    ⏰ Time’s up!
</div>

<div class="controls">
    <button class="timer-button" onclick="startTimer()">Start Timer</button>
    <button class="show" onclick="showAnswer()">Show Answer</button>
    <button class="reset" onclick="resetQuestion()">Reset</button>
    <button class="next" onclick="nextQuestion()">Next Question</button>
</div>

<div class="answer-key" id="answerKey"></div>

<audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
</audio>

</div>

<script>
const questions = [
    {
        sentence:"Eco-friendly scooters won't produce harmful fumes.",
        words:["fumes", "produce", "won't", "harmful", "Eco-friendly scooters", "."]
    },
    {
        sentence:"Will underwater buses become popular soon?",
        words:["become", "underwater buses", "soon", "Will", "popular", "?"]
    },
    {
        sentence:"Future automated airplanes will not need pilots.",
        words:["need", "pilots", "automated", "will", "airplanes", "Future", "not", "."]
    },
    {
        sentence:"Underwater trains will connect many countries in the future.",
        words:["trains", "will", "many countries", "in", "future", "connect", "Underwater", "the", "."]
    },
    {
        sentence:"Will you go to school by skyTran?",
        words:["you", "to school", "Will", "by", "go", "skyTran", "?"]
    },
    {
        sentence:"I think many people will use flying cars in the future.",
        words:["future", "will", "in", "use", "I", "people", "the", "flying cars", "think", "."]
    }
];

let currentQuestion = 0;
let animationId = null;
let movingWords = [];

let timerInterval = null;
let timeLeft = 60;
let timerRunning = false;

let musicStarted = false;

const wordBank = document.getElementById("wordBank");
const answerZone = document.getElementById("answerZone");
const answerKey = document.getElementById("answerKey");
const timerDisplay = document.getElementById("timer");
const timerBox = document.getElementById("timerBox");
const timeMessage = document.getElementById("timeMessage");
const bgMusic = document.getElementById("bgMusic");

bgMusic.volume = 0.35;

function startBackgroundMusic(){
    if(musicStarted) return;

    bgMusic.loop = true;

    bgMusic.play()
        .then(() => {
            musicStarted = true;
        })
        .catch(() => {
            console.log("Music needs user interaction to start.");
        });
}

function shuffle(array){
    return array.sort(() => Math.random() - 0.5);
}

function isOverlapping(rect1, rect2, gap = 10){
    return !(
        rect1.right + gap < rect2.left ||
        rect1.left > rect2.right + gap ||
        rect1.bottom + gap < rect2.top ||
        rect1.top > rect2.bottom + gap
    );
}

function getWordRect(wordElement, left, top){
    return {
        left:left,
        top:top,
        right:left + wordElement.offsetWidth,
        bottom:top + wordElement.offsetHeight
    };
}

function getRandomPosition(wordElement){
    const paddingTop = 60;

    const maxLeft = wordBank.clientWidth - wordElement.offsetWidth - 10;
    const maxTop = wordBank.clientHeight - wordElement.offsetHeight - 10;

    const left = Math.random() * Math.max(maxLeft, 50);
    const top = paddingTop + Math.random() * Math.max(maxTop - paddingTop, 40);

    return { left, top };
}

function getNonOverlappingPosition(wordElement){
    const maxAttempts = 120;

    for(let attempt = 0; attempt < maxAttempts; attempt++){
        const position = getRandomPosition(wordElement);
        const newRect = getWordRect(wordElement, position.left, position.top);

        let hasOverlap = false;

        for(const otherWord of movingWords){
            if(otherWord === wordElement) continue;
            if(otherWord.dataset.fixed === "true") continue;

            const otherLeft = parseFloat(otherWord.style.left);
            const otherTop = parseFloat(otherWord.style.top);
            const otherRect = getWordRect(otherWord, otherLeft, otherTop);

            if(isOverlapping(newRect, otherRect, 16)){
                hasOverlap = true;
                break;
            }
        }

        if(!hasOverlap){
            return position;
        }
    }

    return getRandomPosition(wordElement);
}

function separateOverlappingWords(){
    const activeWords = movingWords.filter(word => word.dataset.fixed !== "true");

    for(let i = 0; i < activeWords.length; i++){
        for(let j = i + 1; j < activeWords.length; j++){
            const wordA = activeWords[i];
            const wordB = activeWords[j];

            let ax = parseFloat(wordA.style.left);
            let ay = parseFloat(wordA.style.top);
            let bx = parseFloat(wordB.style.left);
            let by = parseFloat(wordB.style.top);

            const rectA = getWordRect(wordA, ax, ay);
            const rectB = getWordRect(wordB, bx, by);

            if(isOverlapping(rectA, rectB, 12)){
                let avx = parseFloat(wordA.dataset.vx);
                let avy = parseFloat(wordA.dataset.vy);
                let bvx = parseFloat(wordB.dataset.vx);
                let bvy = parseFloat(wordB.dataset.vy);

                wordA.dataset.vx = -avx;
                wordA.dataset.vy = -avy;
                wordB.dataset.vx = -bvx;
                wordB.dataset.vy = -bvy;

                const centerAX = ax + wordA.offsetWidth / 2;
                const centerAY = ay + wordA.offsetHeight / 2;
                const centerBX = bx + wordB.offsetWidth / 2;
                const centerBY = by + wordB.offsetHeight / 2;

                let dx = centerAX - centerBX;
                let dy = centerAY - centerBY;

                if(dx === 0) dx = Math.random() < 0.5 ? -1 : 1;
                if(dy === 0) dy = Math.random() < 0.5 ? -1 : 1;

                const distance = Math.sqrt(dx * dx + dy * dy);
                const pushX = (dx / distance) * 4;
                const pushY = (dy / distance) * 4;

                ax += pushX;
                ay += pushY;
                bx -= pushX;
                by -= pushY;

                const minY = 45;
                const maxAX = wordBank.clientWidth - wordA.offsetWidth;
                const maxAY = wordBank.clientHeight - wordA.offsetHeight;
                const maxBX = wordBank.clientWidth - wordB.offsetWidth;
                const maxBY = wordBank.clientHeight - wordB.offsetHeight;

                wordA.style.left = Math.max(0, Math.min(ax, maxAX)) + "px";
                wordA.style.top = Math.max(minY, Math.min(ay, maxAY)) + "px";

                wordB.style.left = Math.max(0, Math.min(bx, maxBX)) + "px";
                wordB.style.top = Math.max(minY, Math.min(by, maxBY)) + "px";
            }
        }
    }
}

function loadQuestion(){
    if(animationId){
        cancelAnimationFrame(animationId);
    }

    resetTimer();

    wordBank.querySelectorAll(".word").forEach(word => word.remove());
    answerZone.innerHTML = "";
    answerZone.classList.remove("has-word");

    answerKey.textContent = "";
    answerKey.classList.remove("show-answer");

    timeMessage.classList.remove("show-time-message");

    document.getElementById("questionNum").textContent = currentQuestion + 1;

    movingWords = [];

    const words = shuffle([...questions[currentQuestion].words]);

    words.forEach(wordText => {
        const word = document.createElement("div");

        word.className = "word";
        word.textContent = wordText;
        word.draggable = true;
        word.dataset.fixed = "false";

        word.dataset.vx = (Math.random() * 0.35 + 0.15) * (Math.random() < 0.5 ? -1 : 1);
        word.dataset.vy = (Math.random() * 0.35 + 0.15) * (Math.random() < 0.5 ? -1 : 1);

        addDragEvents(word);

        wordBank.appendChild(word);

        const position = getNonOverlappingPosition(word);
        word.style.left = position.left + "px";
        word.style.top = position.top + "px";

        movingWords.push(word);
    });

    animateWords();
}

function animateWords(){
    movingWords.forEach(word => {
        if(word.dataset.fixed === "true") return;

        let x = parseFloat(word.style.left);
        let y = parseFloat(word.style.top);

        let vx = parseFloat(word.dataset.vx);
        let vy = parseFloat(word.dataset.vy);

        x += vx;
        y += vy;

        const minY = 45;
        const maxX = wordBank.clientWidth - word.offsetWidth;
        const maxY = wordBank.clientHeight - word.offsetHeight;

        if(x <= 0 || x >= maxX){
            vx *= -1;
            x = Math.max(0, Math.min(x, maxX));
        }

        if(y <= minY || y >= maxY){
            vy *= -1;
            y = Math.max(minY, Math.min(y, maxY));
        }

        word.dataset.vx = vx;
        word.dataset.vy = vy;

        word.style.left = x + "px";
        word.style.top = y + "px";
    });

    separateOverlappingWords();

    animationId = requestAnimationFrame(animateWords);
}

function addDragEvents(word){
    word.addEventListener("dragstart", () => {
        startBackgroundMusic();
        word.classList.add("dragging");
    });

    word.addEventListener("dragend", () => {
        word.classList.remove("dragging");
    });
}

document.addEventListener("dragover", event => {
    event.preventDefault();
});

answerZone.addEventListener("dragover", event => {
    event.preventDefault();
});

answerZone.addEventListener("drop", event => {
    event.preventDefault();

    const dragged = document.querySelector(".dragging");

    if(!dragged) return;

    dragged.dataset.fixed = "true";

    dragged.style.position = "relative";
    dragged.style.left = "0";
    dragged.style.top = "0";

    answerZone.appendChild(dragged);
    updateAnswerPlaceholder();
});

wordBank.addEventListener("dragover", event => {
    event.preventDefault();
});

wordBank.addEventListener("drop", event => {
    event.preventDefault();

    const dragged = document.querySelector(".dragging");

    if(!dragged) return;

    dragged.dataset.fixed = "false";
    dragged.style.position = "absolute";

    wordBank.appendChild(dragged);

    const position = getNonOverlappingPosition(dragged);
    dragged.style.left = position.left + "px";
    dragged.style.top = position.top + "px";

    if(!movingWords.includes(dragged)){
        movingWords.push(dragged);
    }

    updateAnswerPlaceholder();
});

function updateAnswerPlaceholder(){
    const hasWords = answerZone.querySelectorAll(".word").length > 0;

    if(hasWords){
        answerZone.classList.add("has-word");
    }else{
        answerZone.classList.remove("has-word");
    }
}

function updateTimerDisplay(){
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    timerDisplay.textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

    timerBox.classList.remove("warning", "time-up");

    if(timeLeft <= 0){
        timerBox.classList.add("time-up");
    }else if(timeLeft <= 10){
        timerBox.classList.add("warning");
    }
}

function startTimer(){
    startBackgroundMusic();

    if(timerRunning) return;

    timerRunning = true;
    timeMessage.classList.remove("show-time-message");

    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if(timeLeft <= 0){
            clearInterval(timerInterval);
            timerInterval = null;
            timerRunning = false;
            timeLeft = 0;
            updateTimerDisplay();
            timeMessage.classList.add("show-time-message");
        }
    }, 1000);
}

function resetTimer(){
    clearInterval(timerInterval);
    timerInterval = null;
    timerRunning = false;
    timeLeft = 60;
    updateTimerDisplay();
    timeMessage.classList.remove("show-time-message");
}

function showAnswer(){
    startBackgroundMusic();
    answerKey.textContent = questions[currentQuestion].sentence;
    answerKey.classList.add("show-answer");
}

function resetQuestion(){
    startBackgroundMusic();
    loadQuestion();
}

function nextQuestion(){
    startBackgroundMusic();

    currentQuestion++;

    if(currentQuestion >= questions.length){
        currentQuestion = 0;
    }

    loadQuestion();
}

window.addEventListener("resize", () => {
    movingWords.forEach(word => {
        if(word.dataset.fixed === "false"){
            const position = getNonOverlappingPosition(word);
            word.style.left = position.left + "px";
            word.style.top = position.top + "px";
        }
    });
});

loadQuestion();
</script>

</body>
</html>
